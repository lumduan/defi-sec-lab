# defi-sec-lab gitleaks configuration (gitleaks v8.30.1).
#
# gitleaks' built-in rules are kept (useDefault). On top of them, this file adds rules for the secrets a
# DeFi fork lab is most likely to leak. Verified 2026-09-15: NEITHER gitleaks' default rules NOR GitHub
# push protection detect RPC URLs with embedded API keys (Alchemy / Infura / QuickNode ...), or private
# keys assigned to names like DEPLOYER_PK.
#
# Used by: .githooks/pre-commit (staged changes), .githooks/pre-push (pushed commits),
#          .github/workflows/security.yml (full history). Rule self-test: scripts/test-secret-rules.sh

title = "defi-sec-lab"

[extend]
useDefault = true

# ---------------------------------------------------------------------------------------------------
# RPC provider URLs carrying an API key (the key is the reported secret)
# ---------------------------------------------------------------------------------------------------
[[rules]]
id = "rpc-url-alchemy"
description = "Alchemy RPC URL with an embedded API key"
regex = '''(?:https?|wss?)://[a-z0-9-]+\.g\.alchemy\.com/v2/([A-Za-z0-9_-]{16,})'''
secretGroup = 1
keywords = ["alchemy.com"]

[[rules]]
id = "rpc-url-infura"
description = "Infura RPC URL with an embedded project ID / API key"
regex = '''(?:https?|wss?)://[a-z0-9-]+\.infura\.io/(?:ws/)?v3/([0-9a-fA-F]{32})'''
secretGroup = 1
keywords = ["infura.io"]

[[rules]]
id = "rpc-url-quicknode"
description = "QuickNode endpoint URL with an embedded token"
regex = '''(?:https?|wss?)://[a-z0-9-]+(?:\.[a-z0-9-]+)*\.quiknode\.pro/([0-9a-fA-F]{20,})'''
secretGroup = 1
keywords = ["quiknode.pro"]

[[rules]]
id = "rpc-url-ankr"
description = "Ankr RPC URL with an embedded API key"
regex = '''(?:https?|wss?)://rpc\.ankr\.com/[a-z0-9_]+/([0-9a-fA-F]{32,})'''
secretGroup = 1
keywords = ["rpc.ankr.com"]

[[rules]]
id = "rpc-url-drpc"
description = "dRPC URL with an embedded dkey"
regex = '''(?:https?|wss?)://lb\.drpc\.org/[^\s"'<>]*[?&]dkey=([A-Za-z0-9_-]{16,})'''
secretGroup = 1
keywords = ["drpc.org"]

[[rules]]
id = "rpc-url-chainstack"
description = "Chainstack endpoint URL with an embedded key"
regex = '''(?:https?|wss?)://[a-z0-9-]+\.core\.chainstack\.com/(?:ws/)?([0-9a-fA-F]{32})'''
secretGroup = 1
keywords = ["chainstack.com"]

[[rules]]
id = "rpc-url-blastapi"
description = "Blast API endpoint URL with an embedded project ID"
regex = '''(?:https?|wss?)://[a-z0-9-]+\.blastapi\.io/([0-9a-fA-F-]{36})'''
secretGroup = 1
keywords = ["blastapi.io"]

[[rules]]
id = "rpc-url-tenderly"
description = "Tenderly gateway URL with an embedded access key"
regex = '''(?:https?|wss?)://[a-z0-9-]+\.gateway\.tenderly\.co/([A-Za-z0-9]{20,})'''
secretGroup = 1
keywords = ["tenderly.co"]

# ---------------------------------------------------------------------------------------------------
# Any URL assigned to an RPC-ish variable: catches providers without a dedicated rule above
# ---------------------------------------------------------------------------------------------------
[[rules]]
id = "rpc-url-assignment"
description = "URL assigned to an *RPC* variable (possible private endpoint with credentials)"
regex = '''(?i)[a-z0-9_]*rpc[a-z0-9_]*["']?[ \t]*[:=][ \t]*["']?((?:https?|wss?)://[^\s"'<>`]+)'''
secretGroup = 1
keywords = ["rpc"]

  [[rules.allowlists]]
  description = "Local endpoints (the fork and this repo's internal services) are not secrets"
  regexTarget = "secret"
  regexes = [
    '''^(?:https?|wss?)://(?:localhost|127\.0\.0\.1|0\.0\.0\.0|anvil|inspector-api)(?::[0-9]+)?(?:[/?#][^\s]*)?$''',
    '''^(?:https?|wss?)://(?:[a-z0-9-]+\.)*example\.(?:com|org|net)(?::[0-9]+)?(?:[/?#][^\s]*)?$''',
  ]

  [[rules.allowlists]]
  description = "Documentation placeholders such as <key> or ${VAR}"
  regexTarget = "line"
  regexes = [
    '''(?:https?|wss?)://[^\s"'`]*(?:<[A-Za-z_-]+>|\$\{[A-Za-z_]+\})''',
  ]

# ---------------------------------------------------------------------------------------------------
# Ethereum private keys, mnemonics, block-explorer API keys
# ---------------------------------------------------------------------------------------------------
[[rules]]
id = "eth-private-key-assignment"
description = "64-hex private key assigned to a key-like name (PRIVATE_KEY, DEPLOYER_PK, SIGNER_KEY, ...)"
regex = '''(?i)(?:private[_-]?key|priv[_-]?key|secret[_-]?key|signer[_-]?key|wallet[_-]?key|deployer[_-]?(?:pk|key)|[a-z0-9]_pk|\bpk)["']?[ \t]*[:=][ \t]*["']?((?:0x)?[0-9a-f]{64})\b'''
secretGroup = 1
keywords = ["key", "pk"]

[[rules]]
id = "mnemonic-assignment"
description = "BIP-39 style mnemonic assigned to a variable"
regex = '''(?i)(?:mnemonic|seed[_-]?phrase|recovery[_-]?phrase)["']?[ \t]*[:=][ \t]*["']?((?:[a-z]{3,8}[ \t]+){11,23}[a-z]{3,8})'''
secretGroup = 1
keywords = ["mnemonic", "seed", "recovery"]

[[rules]]
id = "block-explorer-api-key"
description = "Etherscan-family API key (Etherscan, Arbiscan, Basescan, ...)"
regex = '''(?i)(?:etherscan|arbiscan|basescan|polygonscan|bscscan|snowtrace)[a-z0-9_]*key["']?[ \t]*[:=][ \t]*["']?([a-z0-9]{34})\b'''
secretGroup = 1
keywords = ["etherscan", "arbiscan", "basescan", "polygonscan", "bscscan", "snowtrace"]

# ---------------------------------------------------------------------------------------------------
# Global allowlist: anvil's PUBLIC development accounts. AGENTS.md sanctions exactly these keys.
# Values derived with `cast wallet private-key "test ... junk" <0-9>`.
# ---------------------------------------------------------------------------------------------------
[[allowlists]]
description = "anvil default dev keys (mnemonic 'test test test test test test test test test test test junk', indexes 0-9)"
regexTarget = "secret"
regexes = [
  '''(?i)^(?:0x)?ac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
  '''(?i)^(?:0x)?59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d$''',
  '''(?i)^(?:0x)?5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a$''',
  '''(?i)^(?:0x)?7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6$''',
  '''(?i)^(?:0x)?47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a$''',
  '''(?i)^(?:0x)?8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba$''',
  '''(?i)^(?:0x)?92db14e403b83dfe3df233f83dfa3a0d7096f21ca9b0d6d6b8d88b2b4ec1564e$''',
  '''(?i)^(?:0x)?4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356$''',
  '''(?i)^(?:0x)?dbda1821b80551c9d65939329250298aa3472ba22feea921c0cf5d620ea67b97$''',
  '''(?i)^(?:0x)?2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6$''',
  '''(?i)^test test test test test test test test test test test junk$''',
]

# ---------------------------------------------------------------------------------------------------
# Global allowlist: EVM addresses. An address is a public on-chain identifier, never a credential.
# Why this exists: on 2026-09-15 gitleaks' default `generic-api-key` rule flagged the public Aave address
# 0xd94112B5…dC9B in notes/evidence/00-ReadAaveReserve-504982668.log, because it follows the word
# "stableDebtTokenAddress" and a mixed-case checksummed address has entropy > 3.5.
# Deliberately narrow: exactly 0x + 40 hex. 64-hex values (private keys) stay covered.
# The self-test proves generic-api-key still fires on real token values.
# ---------------------------------------------------------------------------------------------------
[[allowlists]]
description = "detect-secrets baseline: its `hashed_secret` lines are SHA-1 hashes of audited non-secrets"
# generic-api-key reads `"hashed_secret": "<40 hex>"` as a key named "secret". Narrow on purpose: only
# that exact line shape, only inside .secrets.baseline, only for generic-api-key (condition AND).
# Every other rule still scans the file, and the same line anywhere else is still flagged (self-test).
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)\.secrets\.baseline$''']
regexTarget = "line"
regexes = ['''^\s*"hashed_secret": "[0-9a-f]{40}",?\s*$''']

[[allowlists]]
description = "EVM addresses (0x + exactly 40 hex) are public identifiers"
regexTarget = "secret"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
]

# Correctness checks for the learn/ teaching app. No secrets are used: API tests replay recorded fork
# responses offline, so they run safely for pull requests from forks too.
name: app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: learn/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install (hash-pinned)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Test (offline, replays recorded fork RPC responses)
        run: python -m pytest
